<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1210" viewBox="0 0 2400 1210"><title>经典黑白 ER · 通用逻辑表关系示例</title><desc>三实体三条逻辑引用；未声明物理外键，基数待确认。字段 source=CACHE 时才引用快照。</desc><defs><marker id="er-classic-mono-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4B4B4B"/></marker></defs><rect width="2400" height="1210" fill="#FFFFFF"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="1200" y="90" font-size="40" text-anchor="middle" fill="#222222">三表逻辑关系 · 工作空间 / 执行记录 / 产物快照</text><text x="1200" y="144" font-size="26" text-anchor="middle" fill="#222222">箭头表示逻辑引用方向，不代表物理外键或基数；条件引用单独标注</text><path data-diagram-role="connector" d="M810 519 H700 V437 H610" fill="none" stroke="#4B4B4B" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#er-classic-mono-arrow)"/><path data-diagram-role="connector" d="M1510 683 H1640 V437 H1710" fill="none" stroke="#4B4B4B" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#er-classic-mono-arrow)"/><path data-diagram-role="connector" d="M2250 519 H2340 V245 H1570 V437 H1510" fill="none" stroke="#4B4B4B" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#er-classic-mono-arrow)"/><text x="700" y="402" font-size="22" text-anchor="middle" fill="#222222">workspace_id</text><text x="1930" y="217" font-size="22" text-anchor="middle" fill="#222222">成功执行来源：source_event_id → event_id</text><text x="1610" y="750" font-size="22" text-anchor="middle" fill="#222222">source=CACHE</text><defs><clipPath id="er-classic-mono-workspace-clip"><rect x="70" y="320" width="540" height="322" rx="16"/></clipPath></defs><rect x="70" y="320" width="540" height="322" rx="16" fill="#FFFFFF"/><rect x="70" y="320" width="540" height="76" fill="#F0F0F0" clip-path="url(#er-classic-mono-workspace-clip)"/><text x="340.0" y="368" font-size="28" text-anchor="middle" fill="#222222">workspace</text><path d="M70 396 H610" fill="none" stroke="#DDDDDD" stroke-width="1.3"/><text x="92" y="446" font-size="24" text-anchor="start" fill="#222222">workspace_id</text><text x="588" y="446" font-size="23" text-anchor="end" fill="#222222">PK</text><path d="M70 478 H610" fill="none" stroke="#DDDDDD" stroke-width="1.3"/><text x="92" y="528" font-size="24" text-anchor="start" fill="#222222">name</text><text x="588" y="528" font-size="23" text-anchor="end" fill="#222222">名称</text><path d="M70 560 H610" fill="none" stroke="#DDDDDD" stroke-width="1.3"/><text x="92" y="610" font-size="24" text-anchor="start" fill="#222222">created_at</text><text x="588" y="610" font-size="23" text-anchor="end" fill="#222222">创建时间</text><rect x="70" y="320" width="540" height="322" rx="16" fill="none" stroke="#777777" stroke-width="2"/><defs><clipPath id="er-classic-mono-execution_log-clip"><rect x="810" y="320" width="700" height="486" rx="16"/></clipPath></defs><rect x="810" y="320" width="700" height="486" rx="16" fill="#FFFFFF"/><rect x="810" y="320" width="700" height="76" fill="#F0F0F0" clip-path="url(#er-classic-mono-execution_log-clip)"/><text x="1160.0" y="368" font-size="28" text-anchor="middle" fill="#222222">execution_log</text><path d="M810 396 H1510" fill="none" stroke="#DDDDDD" stroke-width="1.3"/><text x="832" y="446" font-size="24" text-anchor="start" fill="#222222">event_id</text><text x="1488" y="446" font-size="23" text-anchor="end" fill="#222222">PK</text><path d="M810 478 H1510" fill="none" stroke="#DDDDDD" stroke-width="1.3"/><text x="832" y="528" font-size="24" text-anchor="start" fill="#222222">workspace_id</text><text x="1488" y="528" font-size="23" text-anchor="end" fill="#222222">逻辑引用</text><path d="M810 560 H1510" fill="none" stroke="#DDDDDD" stroke-width="1.3"/><text x="832" y="610" font-size="24" text-anchor="start" fill="#222222">source</text><text x="1488" y="610" font-size="23" text-anchor="end" fill="#222222">EXECUTION / CACHE</text><path d="M810 642 H1510" fill="none" stroke="#DDDDDD" stroke-width="1.3"/><text x="832" y="692" font-size="24" text-anchor="start" fill="#222222">snapshot_id</text><text x="1488" y="692" font-size="23" text-anchor="end" fill="#222222">条件引用 · 可空</text><path d="M810 724 H1510" fill="none" stroke="#DDDDDD" stroke-width="1.3"/><text x="832" y="774" font-size="24" text-anchor="start" fill="#222222">created_at</text><text x="1488" y="774" font-size="23" text-anchor="end" fill="#222222">记录时间</text><rect x="810" y="320" width="700" height="486" rx="16" fill="none" stroke="#777777" stroke-width="2"/><defs><clipPath id="er-classic-mono-artifact_snapshot-clip"><rect x="1710" y="320" width="540" height="404" rx="16"/></clipPath></defs><rect x="1710" y="320" width="540" height="404" rx="16" fill="#FFFFFF"/><rect x="1710" y="320" width="540" height="76" fill="#F0F0F0" clip-path="url(#er-classic-mono-artifact_snapshot-clip)"/><text x="1980.0" y="368" font-size="28" text-anchor="middle" fill="#222222">artifact_snapshot</text><path d="M1710 396 H2250" fill="none" stroke="#DDDDDD" stroke-width="1.3"/><text x="1732" y="446" font-size="24" text-anchor="start" fill="#222222">snapshot_id</text><text x="2228" y="446" font-size="23" text-anchor="end" fill="#222222">PK</text><path d="M1710 478 H2250" fill="none" stroke="#DDDDDD" stroke-width="1.3"/><text x="1732" y="528" font-size="24" text-anchor="start" fill="#222222">source_event_id</text><text x="2228" y="528" font-size="23" text-anchor="end" fill="#222222">来源执行记录</text><path d="M1710 560 H2250" fill="none" stroke="#DDDDDD" stroke-width="1.3"/><text x="1732" y="610" font-size="24" text-anchor="start" fill="#222222">created_at</text><text x="2228" y="610" font-size="23" text-anchor="end" fill="#222222">创建时间</text><path d="M1710 642 H2250" fill="none" stroke="#DDDDDD" stroke-width="1.3"/><text x="1732" y="692" font-size="24" text-anchor="start" fill="#222222">payload_hash</text><text x="2228" y="692" font-size="23" text-anchor="end" fill="#222222">内容摘要</text><rect x="1710" y="320" width="540" height="404" rx="16" fill="none" stroke="#777777" stroke-width="2"/><rect x="70" y="850" width="540" height="190" rx="16" fill="#F8F8F8" stroke="#999999" stroke-width="2"/><text x="340.0" y="898" font-size="26" text-anchor="middle" fill="#222222">逻辑模型示例</text><text x="340.0" y="943" font-size="24" text-anchor="middle" fill="#222222">未提供 DDL 与基数约束</text><text x="340.0" y="988" font-size="24" text-anchor="middle" fill="#222222">不据此声明外键与级联规则</text><rect x="1710" y="850" width="540" height="190" rx="16" fill="#F8F8F8" stroke="#999999" stroke-width="2"/><text x="1980.0" y="898" font-size="26" text-anchor="middle" fill="#222222">条件引用</text><text x="1980.0" y="943" font-size="24" text-anchor="middle" fill="#222222">source=CACHE 时引用快照</text><text x="1980.0" y="988" font-size="24" text-anchor="middle" fill="#222222">执行成功时可生成快照</text><text x="1200" y="1135" font-size="25" text-anchor="middle" fill="#222222">示例仅演示表、字段与条件引用；数据类型、可空性、基数及物理约束以实际来源为准。</text></g></svg>
