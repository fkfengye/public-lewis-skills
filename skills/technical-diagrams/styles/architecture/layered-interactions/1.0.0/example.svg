"/><path data-crossing-bridge="true" d="M912 645 A12 12 0 0 0 888 645" fill="none" stroke="#4D74B5" stroke-width="2.1"/><g data-system="client"><g id="tpl-layered-v1-node-page"><rect x="600" y="180" width="600" height="100" rx="16" fill="#EDF3FA" stroke="#98B3C9" stroke-width="1.8"/><text x="900.0" y="221.0" font-size="26" text-anchor="middle" fill="#174C7B">任务页面</text><text x="900.0" y="255.0" font-size="22" text-anchor="middle" fill="#174C7B">提交文件处理任务 · 查询进度和结果</text></g></g><g data-system="application"><g id="tpl-layered-v1-node-coordinator"><rect x="200" y="550" width="600" height="130" rx="16" fill="#E9F5F5" stroke="#98B3C9" stroke-width="1.8"/><text x="500.0" y="606.0" font-size="26" text-anchor="middle" fill="#174C7B">任务协调入口</text><text x="500.0" y="640.0" font-size="22" text-anchor="middle" fill="#174C7B">01 提交任务 · 07 只读查询</text></g><g id="tpl-layered-v1-node-worker"><rect x="1000" y="550" width="600" height="130" rx="16" fill="#E9F5F5" stroke="#98B3C9" stroke-width="1.8"/><text x="1300.0" y="606.0" font-size="26" text-anchor="middle" fill="#174C7B">文件处理单元</text><text x="1300.0" y="640.0" font-size="22" text-anchor="middle" fill="#174C7B">读取资源 · 生成通用输出</text></g><g id="tpl-layered-v1-node-task-records"><rect x="200" y="1060" width="600" height="130" rx="16" fill="#FFF8E8" stroke="#98B3C9" stroke-width="1.8"/><text x="500.0" y="1116.0" font-size="26" text-anchor="middle" fill="#174C7B">任务记录</text><text x="500.0" y="1150.0" font-size="22" text-anchor="middle" fill="#174C7B">任务标识 · 处理状态 · 更新时间</text></g><g id="tpl-layered-v1-node-result-index"><rect x="1000" y="1060" width="600" height="130" rx="16" fill="#FFF8E8" stroke="#98B3C9" stroke-width="1.8"/><text x="1300.0" y="1116.0" font-size="26" text-anchor="middle" fill="#174C7B">输出索引</text><text x="1300.0" y="1150.0" font-size="22" text-anchor="middle" fill="#174C7B">输出标识 · 存储位置 · 文件摘要</text></g></g><g data-system="resource"><g id="tpl-layered-v1-node-resource-adapter"><rect x="600" y="1570" width="600" height="120" rx="16" fill="#EDF3FA" stroke="#98B3C9" stroke-width="1.8"/><text x="900.0" y="1621.0" font-size="26" text-anchor="middle" fill="#174C7B">资源处理适配器</text><text x="900.0" y="1655.0" font-size="22" text-anchor="middle" fill="#174C7B">读取输入 · 转换内容 · 生成输出</text></g></g><g data-system="recipient"><g id="tpl-layered-v1-node-notification-recipient"><rect x="600" y="2000" width="600" height="110" rx="16" fill="#EDF3FA" stroke="#98B3C9" stroke-width="1.8"/><text x="900.0" y="2046.0" font-size="26" text-anchor="middle" fill="#174C7B">通用通知接收端</text><text x="900.0" y="2080.0" font-size="22" text-anchor="middle" fill="#174C7B">接收完成通知并确认</text></g></g><text x="610" y="345" font-size="22" text-anchor="middle" fill="#7F94A3">01 提交处理任务</text><text x="700" y="437" font-size="19" text-anchor="middle" fill="#7F94A3">01-R 受理 / 07-R 只读结果</text><text x="1110" y="425" font-size="21" text-anchor="start" fill="#7F94A3">07-Q 查询任务结果</text><text x="420" y="855" font-size="20" text-anchor="end" fill="#A48F4D">02 写入 / 07-Q 查询</text><text x="560" y="920" font-size="20" text-anchor="start" fill="#A48F4D">02-R / 07-DB-R</text><text x="900" y="554" font-size="21" text-anchor="middle" fill="#4D74B5">03 派发处理</text><text x="845" y="710" font-size="19" text-anchor="middle" fill="#4D74B5">03-R</text><text x="860" y="1395" font-size="22" text-anchor="end" fill="#2B8E9B">04 请求资源处理 ↓</text><text x="1000" y="1435" font-size="21" text-anchor="start" fill="#2B8E9B">04-R 处理结果 ↑</text><text x="1250" y="830" font-size="21" text-anchor="end" fill="#A48F4D">05 保存结果目录</text><text x="1400" y="905" font-size="20" text-anchor="start" fill="#A48F4D">05-R 写入确认</text><text x="1640" y="1810" font-size="22" text-anchor="end" fill="#2B8E9B">06 发送完成通知 ↓</text><text x="1630" y="1848" font-size="21" text-anchor="end" fill="#2B8E9B">06-R 接收确认 ↑</text><text x="900" y="2230" font-size="22" text-anchor="middle" fill="#174C7B">实线为单向请求 / 处理；虚线为独立返回 / 确认；圆弧表示跨线不连接。</text><text x="900" y="2272" font-size="21" text-anchor="middle" fill="#6688A3">-Q 为只读查询，-R 为返回；序号表达逻辑顺序，不限制异步实际到达先后。</text><text x="900" y="2312" font-size="20" text-anchor="middle" fill="#6688A3">本图采用通用合成场景，仅用于展示样式与交互规则。</text></g></svg>