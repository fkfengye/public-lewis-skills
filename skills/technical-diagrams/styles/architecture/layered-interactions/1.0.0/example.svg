<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2340" viewBox="0 0 1800 2340" role="img" aria-labelledby="tpl-layered-v1-title"><title id="tpl-layered-v1-title">浅色分层交互 · 通用文件处理示例</title><desc>独立设计的合成示例：任务提交、资源处理、结果索引和完成通知。实线请求、独立虚线返回；圆弧为跨线而非连接。</desc><metadata id="tpl-layered-v1-model">{&quot;profile&quot;:&quot;architecture/layered-interactions@1.0.0&quot;,&quot;number&quot;:&quot;AR-03&quot;,&quot;sample_kind&quot;:&quot;synthetic&quot;,&quot;line_style&quot;:{&quot;id&quot;:&quot;orthogonal&quot;,&quot;version&quot;:&quot;1.0.0&quot;,&quot;source&quot;:&quot;default&quot;},&quot;interaction_standard&quot;:{&quot;id&quot;:&quot;single-direction&quot;,&quot;version&quot;:&quot;1.0.0&quot;},&quot;model&quot;:{&quot;systems&quot;:{&quot;client&quot;:{&quot;bounds&quot;:[70,110,1660,210],&quot;label&quot;:&quot;使用端&quot;},&quot;application&quot;:{&quot;bounds&quot;:[70,460,1660,830],&quot;label&quot;:&quot;文档处理服务（通用）&quot;},&quot;resource&quot;:{&quot;bounds&quot;:[70,1490,1660,280],&quot;label&quot;:&quot;资源处理系统（独立边界）&quot;},&quot;recipient&quot;:{&quot;bounds&quot;:[70,1920,1660,250],&quot;label&quot;:&quot;通知接收系统（独立边界）&quot;}},&quot;nodes&quot;:{&quot;page&quot;:{&quot;system&quot;:&quot;client&quot;,&quot;bounds&quot;:[600,180,600,100],&quot;labels&quot;:[&quot;任务页面&quot;,&quot;提交文件处理任务 · 查询进度和结果&quot;]},&quot;coordinator&quot;:{&quot;system&quot;:&quot;application&quot;,&quot;bounds&quot;:[200,550,600,130],&quot;labels&quot;:[&quot;任务协调入口&quot;,&quot;01 提交任务 · 07 只读查询&quot;]},&quot;worker&quot;:{&quot;system&quot;:&quot;application&quot;,&quot;bounds&quot;:[1000,550,600,130],&quot;labels&quot;:[&quot;文件处理单元&quot;,&quot;读取资源 · 生成通用输出&quot;]},&quot;task-records&quot;:{&quot;system&quot;:&quot;application&quot;,&quot;bounds&quot;:[200,1060,600,130],&quot;labels&quot;:[&quot;任务记录&quot;,&quot;任务标识 · 处理状态 · 更新时间&quot;]},&quot;result-index&quot;:{&quot;system&quot;:&quot;application&quot;,&quot;bounds&quot;:[1000,1060,600,130],&quot;labels&quot;:[&quot;输出索引