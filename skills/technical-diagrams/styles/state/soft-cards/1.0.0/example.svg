<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><defs><filter id="state-soft-cards-shadow" x="-15%" y="-25%" width="130%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#283F64" flood-opacity=".08"/></filter><marker id="state-soft-cards-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#7C909E"/></marker></defs><rect width="1200" height="820" fill="#FFFFFF"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="600" y="42" font-size="27" fill="#174C7B" text-anchor="middle">状态流转（示例）</text><circle cx="600" cy="65" r="8" fill="#222"/><path data-diagram-role="connector" d="M600 73 V150" fill="none" stroke="#7C909E" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#state-soft-cards-arrow)"/><text x="460" y="110" font-size="20" fill="#174C7B" text-anchor="middle">创建请求</text><rect x="510" y="150" width="180" height="58" rx="14" fill="#EDF3FA" stroke="#95B0C5" stroke-width="1.6"/><text x="600.0" y="187.0" font-size="22" fill="#174C7B" text-anchor="middle">处理中</text><path data-diagram-role="connector" d="M600 208 V260 H250 V400" fill="none" stroke="#7C909E" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#state-soft-cards-arrow)"/><path data-diagram-role="connector" d="M600 260 V400" fill="none" stroke="#7C909E" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#state-soft-cards-arrow)"/><path data-diagram-role="connector" d="M600 260 H950 V400" fill="none" stroke="#7C909E" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#state-soft-cards-arrow)"/><rect x="160" y="400" width="180" height="58" rx="14" fill="#EDF3FA" stroke="#95B0C5" stroke-width="1.6"/><text x="250.0" y="437.0" font-size="22" fill="#174C7B" text-anchor="middle">完成</text><rect x="510" y="400" width="180" height="58" rx="14" fill="#EDF3FA" stroke="#95B0C5" stroke-width="1.6"/><text x="600.0" y="437.0" font-size="22" fill="#174C7B" text-anchor="middle">失败</text><rect x="860" y="400" width="180" height="58" rx="14" fill="#EDF3FA" stroke="#95B0C5" stroke-width="1.6"/><text x="950.0" y="437.0" font-size="22" fill="#174C7B" text-anchor="middle">取消</text><text x="135" y="320" font-size="20" fill="#174C7B" text-anchor="middle">完成事件</text><text x="485" y="320" font-size="20" fill="#174C7B" text-anchor="middle">失败事件</text><text x="835" y="320" font-size="20" fill="#174C7B" text-anchor="middle">取消事件</text><path data-diagram-role="connector" d="M690 179 H1100 V115 H640 V150" fill="none" stroke="#7C909E" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#state-soft-cards-arrow)"/><text x="950" y="94" font-size="20" fill="#174C7B" text-anchor="middle">收到重试事件（示例）</text><path d="M250 458 V600" fill="none" stroke="#7C909E" stroke-width="1.5" stroke-dasharray="5 4"/><text x="425" y="540" font-size="20" fill="#174C7B" text-anchor="middle">完成时记录审计</text><rect x="160" y="600" width="180" height="58" rx="6" fill="#F3FAF9" stroke="#95B0C5" stroke-dasharray="5 4"/><text x="250" y="637" font-size="21" fill="#174C7B" text-anchor="middle">动作旁注</text><text x="600" y="745" font-size="20" fill="#174C7B" text-anchor="middle">状态与动作分开建模，事件和允许迁移由业务规则确定</text></g></svg>
