<svg xmlns="http://www.w3.org/2000/svg" width="1850" height="654" viewBox="0 0 1850 654" role="img" aria-labelledby="tl01-title tl01-desc">
  <title id="tl01-title">知识资料整理历程（虚构示例）</title>
  <desc id="tl01-desc">六个等间隔虚构年份的里程碑，展示彩色时间标注、同心圆节点、同色虚线及下方分段卡片；横轴按两年等距。</desc>
