<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1040" viewBox="0 0 2200 1040" role="img" aria-labelledby="interaction-v1-title"><title id="interaction-v1-title">单向请求、独立虚线返回、独立回调与系统边界示例</title><defs><marker id="interaction-v1-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#7894A6"/></marker></defs><rect width="2200" height="1040" fill="#FFFFFF"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="1100" y="60" font-size="38" text-anchor="middle" fill="#174C7B">单向交互与独立系统边界（通用示例）</text><text x="1100" y="104" font-size="22" text-anchor="middle" fill="#6688A3">请求与确认分别布线 · 业务回调保持独立请求 · 模块等宽对齐 · 必要交点使用真实圆弧</text><g data-system-frame="caller"><rect x="50" y="150" width="450" height="730" rx="20" fill="#FAFCFF" stroke="#9BB8CC" stroke-width="1.8"/><text x="275" y="201" font-size="27" text-anchor="middle" fill="#174C7B">调用方系统</text></g><g data-system-frame="service"><rect x="600" y="150" width="450" height="730" rx="20" fill="#FAFCFF" stroke="#9BB8CC" stroke-width="1.8"/><text x="825" y="201" font-size="27" text-anchor="middle" fill="#174C7B">业务服务</text></g><g data-system-frame="platform"><rect x="1150" y="150" width="450" height="730" rx="20" fill="#FAFCFF" stroke="#9BB8CC" stroke-width="1.8"/><text x="1375" y="201" font-size="27" text-anchor="middle" fill="#174C7B">外部平台</text></g><g data-system-frame="downstream"><rect x="1700" y="150" width="450" height="730" rx="20" fill="#FAFCFF" stroke="#9BB8CC" stroke-width="1.8"/><text x="1925" y="201" font-size="27" text-anchor="middle" fill="#174C7B">独立下游机构</text></g><path id="interaction-v1-request-01" data-diagram-role="connector" data-step="01" data-interaction-role="request" d="M470 295 H630" fill="none" stroke="#7894A6" stroke-width="2.1" marker-end="url(#interaction-v1-arrow)"/><path id="interaction-v1-accepted-01-R" data-diagram-role="connector" data-step="01-R" data-interaction-role="acknowledgement" d="M630 330 H470" fill="none" stroke="#7894A6" stroke-width="2.1" stroke-dasharray="7 6" marker-end="url(#interaction-v1-arrow)"/><path id="interaction-v1-request-02" data-diagram-role="connector" data-step="02" data-interaction-role="independent_request" d="M1020 295 H1180" fill="none" stroke="#7894A6" stroke-width="2.1" marker-end="url(#interaction-v1-arrow)"/><path id="interaction-v1-accepted-02-R" data-diagram-role="connector" data-step="02-R" data-interaction-role="acknowledgement" d="M1180 330 H1020" fill="none" stroke="#7894A6" stroke-width="2.1" stroke-dasharray="7 6" marker-end="url(#interaction-v1-arrow)"/><path id="interaction-v1-request-03" data-diagram-role="connector" data-step="03" data-interaction-role="request" d="M1570 295 H1730" fill="none" stroke="#7894A6" stroke-width="2.1" marker-end="url(#interaction-v1-arrow)"/><path id="interaction-v1-result-04" data-diagram-role="connector" data-step="04" data-interaction-role="response" d="M1730 330 H1570" fill="none" stroke="#7894A6" stroke-width="2.1" stroke-dasharray="7 6" marker-end="url(#interaction-v1-arrow)"/><path id="interaction-v1-prepare-05a" data-diagram-role="connector" data-step="05a" data-interaction-role="processing" d="M1375 400 V560" fill="none" stroke="#7894A6" stroke-width="2.1" marker-end="url(#interaction-v1-arrow)"/><path id="interaction-v1-callback-05b" data-diagram-role="connector" data-step="05b" data-interaction-role="independent_request" d="M1180 600 H1020" fill="none" stroke="#7894A6" stroke-width="2.1" marker-end="url(#interaction-v1-arrow)"/><path id="interaction-v1-confirmed-06" data-diagram-role="connector" data-step="06" data-interaction-role="acknowledgement" d="M1020 660 H1180" fill="none" stroke="#7894A6" stroke-width="2.1" stroke-dasharray="7 6" marker-end="url(#interaction-v1-arrow)"/><path id="interaction-v1-query-07" data-diagram-role="connector" data-step="07" data-interaction-role="request" d="M470 365 H570 V610 H630" fill="none" stroke="#7894A6" stroke-width="2.1" marker-end="url(#interaction-v1-arrow)"/><path id="interaction-v1-query-result-08" data-diagram-role="connector" data-step="08" data-interaction-role="response" d="M630 660 H530 V390 H470" fill="none" stroke="#7894A6" stroke-width="2.1" stroke-dasharray="7 6" marker-end="url(#interaction-v1-arrow)"/><path id="interaction-v1-scan-T1" data-diagram-role="connector" data-step="T1" data-interaction-role="auxiliary_request" d="M470 580 H520 A10 10 0 0 1 540 580 H560 A10 10 0 0 1 580 580 H630" fill="none" stroke="#7894A6" stroke-width="2.1" marker-end="url(#interaction-v1-arrow)"/><path d="M520 580 A10 10 0 0 1 540 580" fill="none" stroke="#FFFFFF" stroke-width="8"/><path data-crossing-bridge="true" d="M520 580 A10 10 0 0 1 540 580" fill="none" stroke="#7894A6" stroke-width="2.1"/><path d="M560 580 A10 10 0 0 1 580 580" fill="none" stroke="#FFFFFF" stroke-width="8"/><path data-crossing-bridge="true" d="M560 580 A10 10 0 0 1 580 580" fill="none" stroke="#7894A6" stroke-width="2.1"/><g data-system="caller"><rect x="80" y="260" width="390" height="140" rx="16" fill="#EDF3FA" stroke="#9BB8CC" stroke-width="1.8"/><text x="275" y="317" font-size="26" text-anchor="middle" fill="#174C7B">调用页面</text><text x="275" y="358" font-size="22" text-anchor="middle" fill="#174C7B">01 发起处理 · 07 查询结果</text><rect x="80" y="560" width="390" height="140" rx="16" fill="#EDF3FA" stroke="#9BB8CC" stroke-width="1.8"/><text x="275" y="617" font-size="26" text-anchor="middle" fill="#174C7B">T1 独立扫描任务</text><text x="275" y="658" font-size="22" text-anchor="middle" fill="#174C7B">不串接主链成功之后</text></g><g data-system="service"><rect x="630" y="260" width="390" height="140" rx="16" fill="#E9F5F5" stroke="#9BB8CC" stroke-width="1.8"/><text x="825" y="317" font-size="26" text-anchor="middle" fill="#174C7B">业务请求入口</text><text x="825" y="358" font-size="22" text-anchor="middle" fill="#174C7B">区分受理与最终业务结果</text><rect x="630" y="560" width="390" height="140" rx="16" fill="#E9F5F5" stroke="#9BB8CC" stroke-width="1.8"/><text x="825" y="617" font-size="26" text-anchor="middle" fill="#174C7B">业务结果接收</text><text x="825" y="658" font-size="22" text-anchor="middle" fill="#174C7B">05b 保存结果 · 06 完成后确认</text></g><g data-system="platform"><rect x="1180" y="260" width="390" height="140" rx="16" fill="#EDF3FA" stroke="#9BB8CC" stroke-width="1.8"/><text x="1375" y="317" font-size="26" text-anchor="middle" fill="#174C7B">平台处理入口</text><text x="1375" y="358" font-size="22" text-anchor="middle" fill="#174C7B">向独立下游发起调用</text><rect x="1180" y="560" width="390" height="140" rx="16" fill="#EDF3FA" stroke="#9BB8CC" stroke-width="1.8"/><text x="1375" y="617" font-size="26" text-anchor="middle" fill="#174C7B">独立回调发起</text><text x="1375" y="658" font-size="22" text-anchor="middle" fill="#174C7B">业务结果通过新的请求提交</text></g><g data-system="downstream"><rect x="1730" y="260" width="390" height="140" rx="16" fill="#EDF3FA" stroke="#9BB8CC" stroke-width="1.8"/><text x="1925" y="317" font-size="26" text-anchor="middle" fill="#174C7B">下游服务</text><text x="1925" y="358" font-size="22" text-anchor="middle" fill="#174C7B">实际处理并返回业务结果</text></g><text x="550" y="275" font-size="20" text-anchor="middle" fill="#174C7B">01 请求</text><text x="550" y="355" font-size="19" text-anchor="middle" fill="#174C7B">01-R 受理</text><text x="1100" y="275" font-size="20" text-anchor="middle" fill="#174C7B">02 请求</text><text x="1100" y="355" font-size="19" text-anchor="middle" fill="#174C7B">02-R 受理</text><text x="1650" y="275" font-size="20" text-anchor="middle" fill="#174C7B">03 调用</text><text x="1650" y="355" font-size="20" text-anchor="middle" fill="#174C7B">04 结果</text><text x="1420" y="490" font-size="20" text-anchor="start" fill="#174C7B">05a 生成结果</text><text x="1100" y="578" font-size="20" text-anchor="middle" fill="#174C7B">05b 回调</text><text x="1100" y="687" font-size="20" text-anchor="middle" fill="#174C7B">06 确认</text><text x="490" y="480" font-size="20" text-anchor="end" fill="#174C7B">07 只读结果查询</text><text x="490" y="520" font-size="20" text-anchor="end" fill="#174C7B">08 查询结果返回</text><text x="550" y="548" font-size="20" text-anchor="middle" fill="#174C7B">T1</text><text x="825" y="780" font-size="20" text-anchor="middle" fill="#174C7B">07 / 08 为独立查询与返回</text><text x="1375" y="780" font-size="20" text-anchor="middle" fill="#174C7B">05b 是独立请求，不是 02 的响应</text><text x="1925" y="780" font-size="20" text-anchor="middle" fill="#174C7B">平台调用不表示系统归属</text><text x="1100" y="930" font-size="24" text-anchor="middle" fill="#174C7B">实线：请求 / 处理；虚线：结果返回 / 受理与事务确认。每条线只有终点箭头。</text><text x="1100" y="972" font-size="22" text-anchor="middle" fill="#174C7B">05b 为独立回调，06 为其确认；T1 为辅助检查；圆弧表示相交但不连接。</text><text x="1100" y="1011" font-size="20" text-anchor="middle" fill="#6688A3">序号表达逻辑顺序，异步到达可不同；示例不定义具体项目的业务阈值、协议或时限。</text></g></svg>